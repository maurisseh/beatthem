<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Beat the M — Overlay</title>
<link rel="stylesheet" href="style.css">
<style>
  /*
    Feste Referenz-Leinwand: 1920x1080 (16:9). Das Layout (Logo-PNG, Avatare,
    deine Facecam unten Mitte) kommt aus shared/stage.js + style.css (.stage-*).
    Die ganze Bühne wird per JS in jede Fenster-/OBS-Quellgröße skaliert.
  */
  html, body.overlay-body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    background: transparent !important; /* Body selbst bleibt immer transparent */
  }

  #stage {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
  }

  /* Rundenanzeige oben rechts */
  .round-badge {
    position: absolute;
    top: 36px;
    right: 60px;
    background: rgba(0,0,0,.55);
    border: 2px solid var(--color-secondary);
    border-radius: 10px;
    padding: 6px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: #fff;
    letter-spacing: 1px;
  }

  /* Ebenen im Spielinhalt-Bereich (SAFE_CONTENT_AREA = 1800 x 590) */
  .board-layer, .question-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .question-layer { pointer-events: none; }

  .board-layer .board-wrap { width: 100%; height: 100%; }
  .board-layer .board-grid {
    width: 100%;
    height: 100%;
    grid-template-rows: 68px repeat(5, 1fr);
    gap: 8px;
  }
  .board-layer .cat-header {
    font-size: 22px;
    min-height: 0;
    height: 100%;
    padding: 0 8px;
  }
  .board-layer .cell {
    font-size: 38px;
    height: 100%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .question-overlay { width: 1400px; max-height: 570px; }
  .question-overlay .question-text { font-size: 38px; }
  .question-overlay .answer-text { font-size: 32px; }
  .question-overlay .question-value { font-size: 26px; }
</style>
</head>
<body class="overlay-body" id="body">

  <div id="stage"></div>

<script src="client.js"></script>
<script src="shared/stage.js"></script>
<script src="overlay.js"></script>
</body>
</html>
