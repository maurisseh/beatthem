<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Beat the M — Overlay</title>
<link rel="stylesheet" href="style.css">
<style>
  /*
    Feste Referenz-Leinwand: 1920x1080 (16:9). Das Layout (Logo-PNG, Avatare,
    deine Facecam unten Mitte) kommt aus shared/stage.js + style.css (.stage-*).
    Die ganze Bühne wird per JS in jede Fenster-/OBS-Quellgröße skaliert.
  */
  html, body.overlay-body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    background: transparent !important; /* Body selbst bleibt immer transparent */
  }

  #stage {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
  }

  /* Rundenanzeige oben rechts */
  .round-badge {
    position: absolute;
    top: 36px;
    right: 60px;
    background: rgba(0,0,0,.55);
    border: 2px solid var(--color-secondary);
    border-radius: 10px;
    padding: 6px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: #fff;
    letter-spacing: 1px;
  }

  /* Ebenen im Spielinhalt-Bereich (SAFE_CONTENT_AREA = 1800 x 590) */
  .board-layer, .question-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .question-layer { pointer-events: none; }

  .board-layer .board-wrap { width: 100%; height: 100%; }
  .board-layer .board-grid {
    width: 100%;
    height: 100%;
    gap: 8px;
    /* grid-template-columns / -rows setzt overlay.js (Anzahl Kategorien/Zeilen ist einstellbar) */
  }
  .board-layer .cat-header {
    /* Schriftgröße setzt overlay.js je nach Kategorienanzahl und Namenslänge */
    min-height: 0;
    height: 100%;
    padding: 0 10px;
    overflow: hidden;
  }
  .board-layer .cat-label { display: block; width: 100%; text-align: center; overflow-wrap: normal; word-break: normal; }
  .board-layer .cell {
    font-size: var(--cell-fs, 38px);
    height: 100%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Gewinner-Animation (nach der letzten Frage) ---------- */
  .winner-layer {
    position: absolute; inset: 0; z-index: 20; overflow: hidden;
    opacity: 0; visibility: hidden;
    transition: opacity .6s ease, visibility 0s linear .6s;
  }
  .winner-layer.show { opacity: 1; visibility: visible; transition: opacity .6s ease; }

  /* statisches Abdunkeln (clip-path = Loch für deine Facecam, wird nur einmal gezeichnet) */
  .winner-dim {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 38%, rgba(22,26,78,.90) 0%, rgba(4,5,15,.96) 78%);
    /* clip-path setzt overlay.js */
  }
  /* Strahlen: nur das Drehen kostet Rechenleistung, deshalb KEINE Maske — der Rand
     wird stattdessen von einem statischen Abdunkel-Verlauf (.winner-fade) darüber ausgeblendet */
  .winner-rays-clip { position: absolute; inset: 0; }
  .winner-rays-wrap {
    position: absolute; left: 50%; top: 38%;
    width: 1400px; height: 1400px; margin: -700px 0 0 -700px;
  }
  .winner-fade {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 38%, rgba(4,5,15,0) 0%, rgba(4,5,15,0) 12%, rgba(4,5,15,.97) 58%);
    /* clip-path setzt overlay.js */
  }
  .winner-rays {
    position: absolute; inset: 0;
    background: repeating-conic-gradient(from 0deg, rgba(var(--wc), .24) 0deg 9deg, rgba(var(--wc), 0) 9deg 18deg);
    animation: rays-spin 50s linear infinite;
    will-change: transform;
  }
  @keyframes rays-spin { to { transform: rotate(360deg); } }

  /* Solange die Gewinner-Ebene läuft, ruhen die Board-Animationen (spart Rechenleistung, z. B. in OBS) */
  #stage.winner-on .cat-header, #stage.winner-on .cell, #stage.winner-on .question-card,
  #stage.winner-on .facecam-frame, #stage.winner-on .stage-slot .stage-avatar { animation: none; }

  .winner-canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

  .winner-content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 40px; gap: 16px;
  }
  .winner-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 130px; line-height: 1.1; letter-spacing: 12px;
    color: var(--color-secondary);
    text-shadow: 0 0 40px rgba(var(--wc), .85), 0 6px 0 rgba(0,0,0,.5);
    animation: title-pop .9s cubic-bezier(.2, 1.6, .4, 1) both;
  }
  @keyframes title-pop { from { transform: scale(.2) translateY(-90px); opacity: 0; } to { transform: none; opacity: 1; } }

  .winner-row { display: flex; gap: 60px; align-items: flex-start; justify-content: center; }
  .winner-card {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: var(--cw); min-width: 0;
    animation: card-in 1s .35s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  @keyframes card-in { from { transform: scale(.3) translateY(140px); opacity: 0; } to { transform: none; opacity: 1; } }

  .winner-avatar-wrap { position: relative; width: var(--sz); height: var(--sz); }
  .winner-glow {
    position: absolute; inset: 0; border-radius: 32px;
    box-shadow: 0 0 90px 28px var(--pc);
    animation: winner-glow 1.2s ease-in-out infinite alternate;
    will-change: opacity;
  }
  @keyframes winner-glow { from { opacity: .35; } to { opacity: 1; } }
  .winner-avatar {
    position: relative; width: 100%; height: 100%;
    border: 10px solid var(--pc); border-radius: 32px;
    background: rgba(10, 12, 30, .95);
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .winner-avatar img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .winner-avatar .ph { font-family: 'Bebas Neue', sans-serif; font-size: calc(var(--sz) * .5); color: var(--pc); opacity: .6; }
  .winner-name {
    font-family: 'Bebas Neue', sans-serif; font-size: var(--nsz); line-height: 1.1; letter-spacing: 4px;
    color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.5); text-align: center;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .winner-score {
    font-family: 'Bebas Neue', sans-serif; font-size: var(--ssz); line-height: 1.1; letter-spacing: 3px;
    color: var(--color-secondary);
  }

  .question-overlay { width: 1400px; max-height: 570px; padding: 28px 50px; gap: 16px; }
  .question-overlay .question-img {
    max-width: 100%;
    max-height: 270px;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  .question-overlay .question-text { font-size: 38px; }
  .question-overlay .answer-text { font-size: 32px; }
  .question-overlay .question-value { font-size: 26px; }
</style>
</head>
<body class="overlay-body" id="body">

  <div id="stage"></div>

<script src="client.js"></script>
<script src="shared/stage.js"></script>
<script src="overlay.js"></script>
</body>
</html>
